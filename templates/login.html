<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastoral Ingeniería Comercial UC - Inicio de Sesión</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="{{ url_for('static', filename='logo.png') }}"
             alt="Logo Pastoral Ingeniería Comercial UC"
             class="login-logo">
        <h1>Pastoral Ingeniería<br>Comercial UC</h1>
        <div class="login-divider"></div>
        <p>Sistema de Metas de Recaudación</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" class="login-form">
        <div class="form-group">
          <label for="usuario">👤 Usuario</label>
          <input type="text" id="usuario" name="usuario"
                 placeholder="Tu usuario" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">🔒 Contraseña</label>
          <input type="password" id="password" name="password"
                 placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Ingresar →</button>
      </form>
    </div>
  </div>
</body>
</html>
